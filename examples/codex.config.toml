# User-scope Codex MCP (~/.codex/config.toml)
# Replace the args path with this machine's build/index.js, then restart Codex.

[mcp_servers.tts]
command = "node"
args = ["/ABSOLUTE/PATH/TO/talk-to-cursor/build/index.js"]
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "auto"
